<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá, mundo!</title>

    <script>
        let a = "carro";
        var b = 1;
        const c = "casa";

        function clickNoBotao() {
            alert("Olá, mundo!");
        }

        function atualizacaoTexto() {
            let input = document.getElementById("meuInput");
            let p = document.getElementById("para");
            p.textContent = input.value;

            console.log("Oi");
        }
    </script>

    <style>
        body {
            background-color: #eeeeee;
        }

        h1 {
            color: grey;
            font-size: 35px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            text-align: center;
        }

        img {
            max-width: 100%;
            border: solid 2px pink;
            padding: 2px;
        }

        .margem-minima {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .margem-minima input,
        .margem-minima select,
        .margem-minima button {
            width: 50vw;
        }
    </style>

</head>

<body>
    <div>
        <h1>só um título</h1>
        <h2>só um subtítulo</h2>
        <p id="para">só um parágrafo</p>
        <span>só um texto</span>
    </div>

    <div class="margem-minima">
        <img src="lalala.png" />
    </div>

    <div class="margem-minima">
        <a href="https://www.google.com.br/">só um link</a>
    </div>

    <div class="margem-minima">
        <input id="meuInput" type="text" oninput="atualizacaoTexto()">
    </div>

    <div class="margem-minima">
        <select>
            <option> Opção 1 </option>
            <option> Opção 2 </option>
            <option> Opção 3 </option>
        </select>
    </div>

    <div class="margem-minima">
        <button onclick="clickNoBotao()">só um botão</button>
    </div>

</body>

</html>
